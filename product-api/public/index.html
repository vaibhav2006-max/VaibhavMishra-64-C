<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Product Store</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f2f6;margin:0;padding:25px}h1{text-align:center}
form{background:#fff;max-width:650px;margin:0 auto 25px;padding:15px;border-radius:8px;display:flex;gap:8px;flex-wrap:wrap}
form input{flex:1;min-width:120px;padding:8px}button{padding:8px 18px;background:#2f3542;color:#fff;border:none;border-radius:4px;cursor:pointer}
#error{color:#c0392b;text-align:center;min-height:20px}#products{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;max-width:900px;margin:auto}
.card{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.12)}.card h3{margin:0 0 8px}.price{color:#27ae60;font-weight:bold}
</style></head>
<body><h1>Product Store</h1>
<form id="productForm"><input id="name" type="text" placeholder="Product name" required><input id="price" type="number" placeholder="Price" min="0" step="0.01" required><input id="rating" type="number" placeholder="Rating (0-5)" min="0" max="5" step="0.1" required><button type="submit">Add Product</button></form><p id="error"></p><div id="products"></div>
<script>
 const container=document.getElementById('products'),errorEl=document.getElementById('error');
 async function loadProducts(){const res=await fetch('/api/products');const products=await res.json();container.innerHTML='';products.forEach(p=>{const card=document.createElement('div');card.className='card';const title=document.createElement('h3');title.textContent=p.name;const id=document.createElement('div');id.textContent='ID: '+p.id;const price=document.createElement('div');price.className='price';price.textContent='Rs. '+p.price;const rating=document.createElement('div');rating.textContent='Rating: '+p.rating+' / 5';card.append(title,id,price,rating);container.appendChild(card)})}
 document.getElementById('productForm').addEventListener('submit',async e=>{e.preventDefault();errorEl.textContent='';const body={name:document.getElementById('name').value,price:parseFloat(document.getElementById('price').value),rating:parseFloat(document.getElementById('rating').value)};const res=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){const data=await res.json();errorEl.textContent=data.error;return}e.target.reset();loadProducts()});
 loadProducts();
</script></body></html>
