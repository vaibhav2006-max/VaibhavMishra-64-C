<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef1f5; display:flex; justify-content:center; padding-top:40px; }
    .app { background:#fff; width:460px; padding:20px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
    h2 { margin-top:0; text-align:center; } .add { display:flex; gap:8px; margin-bottom:15px; }
    .add input { flex:1; padding:8px; } button { cursor:pointer; border:none; border-radius:4px; padding:6px 10px; color:#fff; background:#2980b9; }
    button.del { background:#e74c3c; } ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #ddd; }
    li span { flex:1; } li span.done { text-decoration:line-through; color:#999; }
  </style>
</head>
<body>
  <div class="app">
    <h2>My To-Do List</h2>
    <div class="add"><input type="text" id="taskInput" placeholder="Enter a task..."><button id="addBtn">Add</button></div>
    <ul id="taskList"></ul>
  </div>
  <script>
    let tasks = [];
    const input = document.getElementById('taskInput');
    const list = document.getElementById('taskList');
    document.getElementById('addBtn').addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    function addTask() { const text = input.value.trim(); if (!text) return; tasks.push({text, done:false}); input.value=''; render(); }
    function deleteTask(i) { tasks.splice(i,1); render(); }
    function moveUp(i) { if (i===0) return; [tasks[i-1],tasks[i]]=[tasks[i],tasks[i-1]]; render(); }
    function moveDown(i) { if (i===tasks.length-1) return; [tasks[i+1],tasks[i]]=[tasks[i],tasks[i+1]]; render(); }
    function toggle(i) { tasks[i].done=!tasks[i].done; render(); }
    function makeButton(label, className, handler) { const b=document.createElement('button'); b.textContent=label; if(className)b.className=className; b.addEventListener('click',handler); return b; }
    function render() {
      list.innerHTML='';
      tasks.forEach((task,i)=>{
        const li=document.createElement('li');
        const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=task.done; cb.addEventListener('change',()=>toggle(i));
        const span=document.createElement('span'); span.textContent=task.text; if(task.done)span.className='done';
        li.append(cb,span,makeButton('Up','',()=>moveUp(i)),makeButton('Down','',()=>moveDown(i)),makeButton('Delete','del',()=>deleteTask(i)));
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
